<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Little Surprise ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: radial-gradient(circle at center, #4b1637, #170b19 70%);
            color: white;
        }

        .container {
            text-align: center;
            z-index: 10;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 45px;
            font-weight: 400;
            animation: glow 2s infinite alternate;
        }

        .gift {
            position: relative;
            width: 150px;
            height: 130px;
            margin: auto;
            cursor: pointer;
            animation: float 2s ease-in-out infinite;
        }

        .box {
            position: absolute;
            bottom: 0;
            width: 150px;
            height: 100px;
            background: linear-gradient(135deg, #ff3d71, #c9184a);
            border-radius: 5px;
            box-shadow: 0 15px 35px rgba(255, 30, 100, 0.4);
        }

        .box::before {
            content: "";
            position: absolute;
            left: 62px;
            width: 26px;
            height: 100%;
            background: #ffd166;
        }

        .lid {
            position: absolute;
            top: 18px;
            left: -8px;
            width: 166px;
            height: 35px;
            background: linear-gradient(135deg, #ff477e, #d41450);
            border-radius: 6px;
            z-index: 3;
            transition: 0.8s ease;
        }

        .lid::before {
            content: "";
            position: absolute;
            left: 70px;
            width: 26px;
            height: 35px;
            background: #ffd166;
        }

        .ribbon {
            position: absolute;
            width: 12px;
            height: 55px;
            background: #ffd166;
            top: -28px;
            left: 69px;
            border-radius: 10px;
            transform: rotate(45deg);
        }

        .gift.open .lid {
            transform: translateY(-90px) rotate(-8deg);
        }

        .tap {
            margin-top: 35px;
            font-size: 15px;
            opacity: 0.8;
        }

        .heart {
            position: absolute;
            font-size: 20px;
            animation: rise 6s linear infinite;
            opacity: 0;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-12px);
            }
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 8px #ff4d88;
            }

            to {
                text-shadow: 0 0 25px #ff4d88;
            }
        }

        @keyframes rise {
            0% {
                transform: translateY(100vh) scale(0.5);
                opacity: 0;
            }

            20% {
                opacity: 0.8;
            }

            100% {
                transform: translateY(-20vh) scale(1.3);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>I have something for you... ❤️</h1>

        <div class="gift" onclick="openGift()">

            <div class="lid">
                <div class="ribbon"></div>
            </div>

            <div class="box"></div>

        </div>

        <div class="tap">
            Tap the gift 🎁
        </div>

    </div>

    <script>
        function openGift() {
            document.querySelector(".gift").classList.add("open");

            setTimeout(() => {
                alert("Your surprise is coming... ❤️");
            }, 800);
        }

        function createHeart() {
            const heart = document.createElement("div");

            heart.className = "heart";
            heart.innerHTML = "❤️";

            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration =
                (4 + Math.random() * 4) + "s";

            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 8000);
        }

        setInterval(createHeart, 700);
    </script>

</body>
</html>
