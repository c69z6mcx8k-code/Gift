<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Little Surprise ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Georgia, serif;
    background:
        radial-gradient(circle at center,
        #3b102c 0%,
        #190914 55%,
        #080409 100%);
    color: white;
}

/* Soft glow behind the gift */

.glow {
    position: absolute;
    width: 260px;
    height: 260px;
    background: rgba(255, 70, 140, 0.18);
    border-radius: 50%;
    filter: blur(70px);
}

/* Main area */

.container {
    position: relative;
    text-align: center;
    z-index: 5;
}

.title {
    font-size: 23px;
    font-weight: normal;
    letter-spacing: 1px;
    margin-bottom: 55px;
}

/* Gift */

.gift {
    position: relative;
    width: 105px;
    height: 90px;
    margin: auto;
    cursor: pointer;
    transition: transform 0.3s;
}

.gift:hover {
    transform: scale(1.05);
}

/* Box */

.box {
    position: absolute;
    bottom: 0;
    left: 5px;
    width: 95px;
    height: 62px;
    border-radius: 3px;
    background: linear-gradient(
        145deg,
        #d91b55,
        #9c123e
    );

    box-shadow:
        0 15px 35px rgba(0,0,0,0.45),
        0 0 25px rgba(255,40,120,0.25);
}

/* Vertical ribbon */

.box::after {
    content: "";
    position: absolute;
    left: 41px;
    top: 0;
    width: 13px;
    height: 62px;
    background: #e8b85c;
}

/* Lid */

.lid {
    position: absolute;
    z-index: 3;
    top: 17px;
    left: 0;
    width: 105px;
    height: 20px;
    border-radius: 4px;
    background: linear-gradient(
        145deg,
        #ed2864,
        #ad1545
    );

    transition:
        transform 0.9s ease,
        top 0.9s ease;
}

/* Ribbon on lid */

.lid::after {
    content: "";
    position: absolute;
    left: 41px;
    top: 0;
    width: 13px;
    height: 20px;
    background: #e8b85c;
}

/* Bow */

.bow-left,
.bow-right {
    position: absolute;
    top: -13px;
    width: 28px;
    height: 18px;
    background: #e8b85c;
    border-radius: 50% 50% 40% 40%;
}

.bow-left {
    left: 28px;
    transform: rotate(25deg);
}

.bow-right {
    left: 48px;
    transform: rotate(-25deg);
}

.bow-center {
    position: absolute;
    z-index: 5;
    top: -8px;
    left: 43px;
    width: 16px;
    height: 16px;
    background: #d9a848;
    border-radius: 50%;
}

/* Opening animation */

.gift.open .lid {
    top: -35px;
    transform: rotate(-7deg);
}

/* Tap text */

.tap {
    margin-top: 38px;
    font-size: 14px;
    letter-spacing: 1px;
    opacity: 0.65;
}

/* Floating hearts */

.heart {
    position: absolute;
    bottom: -30px;
    pointer-events: none;
    animation: floatUp linear forwards;
    opacity: 0;
}

@keyframes floatUp {

    0% {
        transform: translateY(0) scale(0.5);
        opacity: 0;
    }

    20% {
        opacity: 0.7;
    }

    100% {
        transform:
            translateY(-110vh)
            translateX(30px)
            scale(1.2);
        opacity: 0;
    }
}

</style>
</head>

<body>

<div class="glow"></div>

<div class="container">

    <div class="title">
        I have something for you... ❤️
    </div>

    <div class="gift" onclick="openGift()">

        <div class="lid">

            <div class="bow-left"></div>
            <div class="bow-right"></div>
            <div class="bow-center"></div>

        </div>

        <div class="box"></div>

    </div>

    <div class="tap">
        Tap to open
    </div>

</div>


<script>

function openGift() {

    document
        .querySelector(".gift")
        .classList.add("open");

}

function createHeart() {

    const heart = document.createElement("div");

    heart.className = "heart";

    heart.innerHTML =
        Math.random() > 0.5 ? "♡" : "♥";

    heart.style.left =
        Math.random() * 100 + "vw";

    heart.style.fontSize =
        (12 + Math.random() * 15) + "px";

    heart.style.animationDuration =
        (5 + Math.random() * 4) + "s";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 9000);
}

setInterval(createHeart, 900);

</script>

</body>
</html>
